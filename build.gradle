plugins {
    id 'java'
    id 'application'
}

group = 'me.uxokpro1234.retronotes'
version = '2003.1'

repositories {
    mavenCentral()
}

application {
    mainClass = 'me.uxokpro1234.retronotes.Main'
}



dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {

    toolchain {

        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {

    manifest {

        attributes(
                'Main-Class': 'me.uxokpro1234.retronotes.Main'
        )
    }
}